name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'config_server/**'
      - 'discovery/**'
      - 'gateway/**'
      - 'angular-front/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Install Angular dependencies
      - name: Install Angular dependencies
        working-directory: ./angular-front
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force ./node_modules
          npm install

      - name: Build Angular application
        working-directory: ./angular-front
        run: npm run build --prod

      - name: Upload Angular Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: angular-build
          path: angular-front/dist/**

      - name: Run tests for Angular application
        working-directory: ./angular-front
        run: npm test -- --coverage

      - name: Upload Angular test coverage
        uses: actions/upload-artifact@v3
        with:
          name: angular-test-coverage
          path: angular-front/coverage/**

      - name: Build and test Config Service
        working-directory: ./config_server
        run: mvn clean install -DskipTests=false

      - name: Build and test Discovery Service
        working-directory: ./discovery
        run: mvn clean install -DskipTests=false

      - name: Build and test Gateway Service
        working-directory: ./gateway
        run: mvn clean install -DskipTests=false

      - name: Build and test each Backend Service
        run: |
          for service in ./Backend/*/; do
            if [ -f "$service/pom.xml" ]; then
              if [[ "$service" == *"/users_service/" ]]; then
                echo "Skipping $service"
                continue
              fi
              echo "Building $service"
              cd "$service"
              if [[ "$service" == *"/labo_service/" ]]; then
                echo "Excluding SeleniumTest in $service"
                mvn clean install -DskipTests=false -Dtest=!SeleniumTest
                mvn test -Dtest=!SeleniumTest
              else
                mvn clean install -DskipTests=false
                mvn test
              fi
              cd - || exit
            fi
          done

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v2
        with:
          version: latest

      - name: Check Docker Compose location
        run: which docker-compose

      - name: Clean up old Docker images
        run: |
          docker login -u 'solo2002' -p 'salma741789'
          for image in $(docker images --format "{{.Repository}}:{{.Tag}}" | grep 'spring-app-' | grep -v 'angular-app'); do
            docker image rm $image || true
          done

      - name: Clean up old Angular Docker images
        run: |
          for image in $(docker images --format "{{.Repository}}:{{.Tag}}" | grep 'angular-app'); do
            docker image rm $image || true
          done

      - name: Build and Push Docker Images
        uses: docker/login-action@v3
        with:
          username: 'solo2002'
          password: 'salma741789'

      - name: Build and push Docker images
        run: |
          docker-compose build
          docker-compose push