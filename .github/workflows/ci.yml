name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'config_server/**'
      - 'discovery/**'
      - 'gateway/**'
      - 'angular-front/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Install Angular dependencies
      - name: Install Angular dependencies
        working-directory: ./angular-front
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force ./node_modules
          npm install

      - name: Build Angular application
        working-directory: ./angular-front
        run: npm run build --prod

      - name: Upload Angular Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: angular-build
          path: angular-front/dist/**

      - name: Run tests for Angular application
        working-directory: ./angular-front
        run: npm test -- --coverage

      - name: Upload Angular test coverage
        uses: actions/upload-artifact@v3
        with:
          name: angular-test-coverage
          path: angular-front/coverage/**

      - name: Build and test Config Service
        working-directory: ./config_server
        run: mvn clean install -DskipTests=false

      - name: Build and test Discovery Service
        working-directory: ./discovery
        run: mvn clean install -DskipTests=false

      - name: Build and test Gateway Service
        working-directory: ./gateway
        run: mvn clean install -DskipTests=false

      - name: Build and test each Backend Service
        run: |
          for service in ./Backend/*/; do
            if [ -f "$service/pom.xml" ]; then
              if [[ "$service" == *"/users_service/" ]]; then
                echo "Skipping $service"
                continue
              fi
              echo "Building $service"
              cd "$service"
              if [[ "$service" == *"/labo_service/" ]]; then
                echo "Excluding SeleniumTest in $service"
                mvn clean install -DskipTests=false -Dtest=!SeleniumTest
                mvn test -Dtest=!SeleniumTest
              else
                mvn clean install -DskipTests=false
                mvn test
              fi
              cd - || exit
            fi
          done

      - name: Clean up old Docker images
        run: |
          docker login -u 'solo2002' -p 'salma741789'
          for image in $(docker images --format "{{.Repository}}:{{.Tag}}" | grep 'spring-app-' | grep -v 'angular-app'); do
            docker image rm $image || true
          done

      - name: Clean up old Angular Docker images
        run: |
          for image in $(docker images --format "{{.Repository}}:{{.Tag}}" | grep 'angular-app'); do
            docker image rm $image || true
          done

      - name: Build and Push Angular Docker Image
        run: |
          docker login -u 'solo2002' -p 'salma741789'
          if [ -f "./angular-front/Dockerfile" ]; then
          echo "Building Docker image for angular-app"
          IMAGE_NAME="solo2002/angular-app"
          docker build -t "$IMAGE_NAME" ./angular-front
          docker push "$IMAGE_NAME"
          fi
          

      - name: Build and Push Backend Docker Images
        run: |
          docker login -u 'solo2002' -p 'salma741789'
          for service in ./Backend/*/; do
            if [ -f "$service/Dockerfile" ]; then
              echo "Building $service Docker image"
              cd "$service"
              SERVICE_NAME=$(basename "$service" | tr '[:upper:]' '[:lower:]')
              IMAGE_NAME="solo2002/spring-app-$SERVICE_NAME"
              docker build -t "$IMAGE_NAME" .
              docker push "$IMAGE_NAME"
              cd - || exit
            fi
          done
