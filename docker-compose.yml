version: "3.9"

services:
  db:
    image: mysql:5.7
    container_name: mysql-server
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # Define a secure password
      MYSQL_DATABASE: gestion_labo
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
      PMA_ARBITRARY: 1
    ports:
      - "8082:80"
    depends_on:
      - db

  mail-dev:
    image: maildev/maildev
    container_name: mail-dev-bsn
    ports:
      - "1080:1080"
      - "1025:1025"

  spring-app-labo:
    build:
      context: ./Backend/labo_service
      dockerfile: Dockerfile
    container_name: spring-app-labo
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/gestion_labo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword  # Matches MYSQL_ROOT_PASSWORD
    ports:
      - "8083:8083"
    depends_on:
      - db
    restart: on-failure

  spring-app-adresse:
    build:
      context: ./Backend/adresses_service
      dockerfile: Dockerfile
    container_name: spring-app-adresse
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/gestion_labo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword  # Matches MYSQL_ROOT_PASSWORD
    ports:
      - "8083:8083"
    depends_on:
      - db
    restart: on-failure

  spring-app-analyse:
