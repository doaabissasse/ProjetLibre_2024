  angular-app:
    build:
      context: ./angular-front
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:4200"
    volumes:
      - ./angular-front:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

